<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenNews Auditor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>OpenNews Auditor</h1>
    
    <label class="url-label" for="article-url">Enter a news article URL

    </label>

<div class="search-box">

    <input 
        type="text" 
        id="article-url" 
        placeholder="https://..."
    >

    <button id="search-button">Search</button>

</div>

<div id="result"></div>

<script>
    document.getElementById("search-button").addEventListener("click", async function() {
        const urlInput = document.getElementById("article-url").value;
        const resultDiv = document.getElementById("result");

        // Safety check if the input is empty
        if (!urlInput.trim()) {
            resultDiv.innerText = "Please enter a valid URL first.";
            return;
        }

        resultDiv.innerText = "Auditing article... Please wait...";

        try {
            const response = await fetch("/audit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: urlInput
                })
            });

            const data = await response.json();

            // Handle backend errors sent from your trafilatura checks
            if (data.error) {
                resultDiv.innerText = "Error: " + data.error;
            } else {
                resultDiv.innerText = data.article;
            }

        } catch (error) {
            // Handle complete server or network dropouts
            resultDiv.innerText = "Failed to connect to the backend server.";
            console.error(error);
        }
    });
</script>

</body>

</html>
