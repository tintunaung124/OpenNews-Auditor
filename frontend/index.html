<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenNews Auditor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>OpenNews Auditor</h1>
    
    <label class="url-label" for="article-url">Enter a news article URL

    </label>

<div class="search-box">

    <input 
        type="text" 
        id="article-url" 
        placeholder="https://..."
    >

    <button id="search-button">Search</button>

</div>

<div id="result"></div>

<script>
    document.getElementById("search-button").addEventListener("click", async () => {

    const urlInput = document.getElementById("article-url").value;
    const resultDiv = document.getElementById("result");

    if (!urlInput) {
        resultDiv.innerHTML = "<p>Please enter a URL.</p>";
        return;
    }

    resultDiv.innerHTML = "<p>Analyzing article...</p>";

    try {

        const response = await fetch("/audit", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                url: urlInput
            })
        });

        const data = await response.json();

        if (data.error) {
            resultDiv.innerHTML = `<p>${data.error}</p>`;
            return;
        }

        resultDiv.innerHTML = `
            <div class="audit-results">

                <h2>Audit Results</h2>

                <div class="score-card">

                    <div class="score-label">
                        Trust Score
                    </div>

                    <div class="score-number">
                        ${data.llm_score}
                        <span>/ 100</span>
                    </div>

                    <div class="score-bar">
                        <div
                            class="score-fill fill-good"
                            style="width: ${data.llm_score}%"
                        ></div>
                    </div>

                </div>


                <div class="result-card">

                    <h3>Explanation</h3>

                    <p>
                        ${data.explanation}
                    </p>

                </div>


                <div class="result-card">

                    <h3>Extracted Claims</h3>

                    <div class="claims">

                        ${data.extracted_claims.map((claim, index) => `

                            <div class="claim-card">

                                <div class="claim-number">
                                    Claim ${index + 1}
                                </div>

                                <p class="claim-text">
                                    ${claim.claim}
                                </p>

                                <div class="claim-details">

                                    <span>
                                        <strong>Type:</strong>
                                        ${claim.type}
                                    </span>

                                    <span>
                                        <strong>Entities:</strong>
                                        ${claim.entities.join(", ")}
                                    </span>

                                    <span>
                                        <strong>Source:</strong>
                                        ${claim.source_attribution}
                                    </span>

                                    <span>
                                        <strong>Verification:</strong>
                                        ${claim.verification_required}
                                    </span>

                                </div>

                            </div>

                        `).join("")}

                    </div>

                </div>


                <div class="result-card">

                    <h3>Article</h3>

                    <div class="article-text">
                        ${data.article}
                    </div>

                </div>

            </div>
        `;

    } catch (error) {

        resultDiv.innerHTML = `
            <p>Error: ${error.message}</p>
        `;
    }
});

</script>

</body>

</html>
